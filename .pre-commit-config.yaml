repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: Mypy
        entry: uv run --locked mypy src scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: baseline
        name: Baseline consistency
        entry: uv run --locked python scripts/check_baseline.py
        language: system
        pass_filenames: false
        always_run: true
